apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
  namespace: tokobapak-dev
  labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: tokobapak}
spec:
  host: web-tokobapak-dev.apps.fajjjar.my.id
  to: {kind: Service, name: web}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: tokobapak-dev
  labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: tokobapak}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tokobapak-dev
  labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: tokobapak}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auth-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: tokobapak}
    spec:
      securityContext: {runAsNonRoot: true}
      serviceAccountName: auth-service
      volumes:
        - {name: tmp, emptyDir: {}}
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/tokobapak-dev/auth-service:latest
          imagePullPolicy: Always
          ports:
            - {containerPort: 3007, name: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {tcpSocket: {port: 3007}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: 3007}, initialDelaySeconds: 30, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
          env:
            - {name: PORT, value: "3007"}
            - name: DB_HOST
              valueFrom: {configMapKeyRef: {name: service-endpoints, key: POSTGRES_HOST}}
            - {name: DB_PORT, value: "5432"}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: tokobapak-db-app, key: username}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: tokobapak-db-app, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: tokobapak-db-app, key: password}}
            - {name: DB_NAME, value: tokobapak_users}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: tokobapak-secrets, key: JWT_SECRET}}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tokobapak-dev
  labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: tokobapak}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: auth-service}
  ports:
    - {port: 80, targetPort: 3007, name: http}

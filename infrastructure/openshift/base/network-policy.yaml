# Baseline ala payu-dev: default-deny + allow-all-egress.
# ponytail: egress spesifik (dns/kafka) dicoba dulu tapi DNS ClusterIP 172.30.0.10
# tetap timeout di OVN cluster ini — payu-dev sendiri pakai allow-all-egress.
# Kembalikan ke aturan spesifik bila CNI sudah mendukungnya.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tokobapak-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: tokobapak-dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: tokobapak-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-router
  namespace: tokobapak-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
---
# Operator CNPG (openshift-operators) wajib bisa ke instance (8000/9187 status, 5432 replika).
# Tanpa ini phase macet "Instance Status Extraction Error" — pola sama di payu-dev.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-to-database
  namespace: tokobapak-dev
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: tokobapak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
        - podSelector:
            matchLabels:
              cnpg.io/cluster: tokobapak-db
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9187

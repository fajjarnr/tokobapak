# TokoBapak MVP — Podman Compose (Local m6a.4xlarge, tanpa LocalStack)
# 9 service Go 1.27 + 4 infra (postgres, redis, kafka 4 KRaft, elasticsearch) — apache/kafka:4.0.0 KRaft no Zookeeper
# Full AWS: EKS EC2 + RDS t4g.micro + ElastiCache t4g.micro + Kafka self-host 1 broker KRaft (apache/kafka:4) + ALB→Traefik (ADR 0001–0004)
# HIDDEN 9 (ADR 0001: enabled=false) → review, chat, media, promotion, seller, recommendation, analytics, catalog standalone, inventory standalone
# MVP 9 svc Go only; legacy 18svc removed 29 Aug 2026 per ADR 0001 build from 0 (no rollback file).

services:
  # ── Infra ──
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: tokobapak-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tokobapak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:alpine
    container_name: tokobapak-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: docker.io/apache/kafka:4.0.0
    container_name: tokobapak-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: tokobapak-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 9 MVP Services — Go 1.27 uniform (hide 9 lain: review, chat, media, promotion, seller, recommendation, analytics, catalog, inventory) — ADR 0001
  auth-service:
    build:
      context: ../../backend/services/auth-service
      dockerfile: Dockerfile
    container_name: tokobapak-auth-service
    restart: always
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:-tokobapak-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ../../backend/services/user-service
      dockerfile: Dockerfile
    container_name: tokobapak-user-service
    restart: always
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: ../../backend/services/product-service
      dockerfile: Dockerfile
    container_name: tokobapak-product-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=tokobapak_products
    depends_on:
      postgres:
        condition: service_healthy

  cart-service:
    build:
      context: ../../backend/services/cart-service
      dockerfile: Dockerfile
    container_name: tokobapak-cart-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TTL_SECONDS=604800
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ../../backend/services/order-service
      dockerfile: Dockerfile
    container_name: tokobapak-order-service
    restart: always
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: ../../backend/services/payment-service
      dockerfile: Dockerfile
    container_name: tokobapak-payment-service
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BROKERS=kafka:29092
      - PAYU_BASE_URL=${PAYU_BASE_URL:-http://payu-gateway:8080}
      - PAYU_HMAC_SECRET=${PAYU_HMAC_SECRET:-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shipping-service:
    build:
      context: ../../backend/services/shipping-service
      dockerfile: Dockerfile
    container_name: tokobapak-shipping-service
    restart: always
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tokobapak_shipping?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  search-service:
    build:
      context: ../../backend/services/search-service
      dockerfile: Dockerfile
    container_name: tokobapak-search-service
    restart: always
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  notification-service:
    build:
      context: ../../backend/services/notification-service
      dockerfile: Dockerfile
    container_name: tokobapak-notification-service
    restart: always
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Traefik Ingress (local sim ALB→Traefik; cloud ALB→Traefik di EKS)
  traefik:
    image: docker.io/library/traefik:v3.3
    container_name: tokobapak-traefik
    restart: always
    ports:
      - "8080:80"
      - "8081:8080"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    depends_on:
      - product-service
      - cart-service
      - order-service
      - payment-service

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
